<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Character encoding for proper text rendering -->
  <meta charset="UTF-8" />

  <!-- Favicon (icon shown in browser tab) -->
  <link rel="icon" type="image/svg+xml" href="/game-logo.png" />

  <!-- Makes the app responsive on all devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title of the web page (shown in browser tab) -->
  <title>React Tic-Tac-Toe</title>
</head>

<body>

  <!-- Static header section (not controlled by React) -->
  <header>
    <!-- Game logo -->
    <img src="game-logo.png" alt="Hand-drawn tic tac toe game board">

    <!-- Main heading -->
    <h1>Tic-Tac-Toe</h1>
  </header>

  <!-- Root div where the entire React app will be rendered -->
  <div id="root"></div>

  <!-- Entry point of React app (loads index.jsx) -->
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
